name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache & download H2 JDBC driver for E2E tests
        shell: python
        run: |
          import pathlib, urllib.request
          dest = pathlib.Path.home() / ".m2/repository/com/h2database/h2/2.2.224/h2-2.2.224.jar"
          if not dest.is_file():
              dest.parent.mkdir(parents=True, exist_ok=True)
              urllib.request.urlretrieve(
                  "https://repo1.maven.org/maven2/com/h2database/h2/2.2.224/h2-2.2.224.jar",
                  dest,
              )

      - name: Install package
        run: python -m pip install -e .

      - name: Run CLI doctor check
        run: copilot-dbeaver-mcp --doctor

      - name: Run Unit & End-to-End Test Suite
        run: python -m unittest discover -s tests -v
